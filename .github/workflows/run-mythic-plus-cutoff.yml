name: Run Mythic+ Cutoff Update

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Mythic+ cutoff script
        env:
          RAIDER_IO_ACCESS_KEY: ${{ secrets.RAIDER_IO_ACCESS_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REGION: 'eu'
        run: |
          node mythic-plus-discord.js
      - name: Commit updated cutoff state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-cutoff.json
          git diff --staged --quiet || git commit -m "Update last seen cutoff timestamp"
          git push
